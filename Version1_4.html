<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
            color: #24292e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 450px;
            padding: 20px;
        }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 10px; }
        p { color: #586069; margin-bottom: 20px; }
        button {
            background-color: #2ea44f;
            color: white;
            border: 1px solid rgba(27,31,35,.15);
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        button:hover { background-color: #2c974b; }
    </style>
</head>
<body>

<div class="container">
    <h1>404: Repository-Fehler</h1>
    <p>Diese Unterseite konnte nicht geladen werden. Bitte verifizieren Sie Ihre Identität, um den Zugriff wiederherzustellen.</p>
    <button onclick="rickroll()">Identität verifizieren</button>
</div>

<script>
    function rickroll() {
        window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ&autoplay=1";
    }
</script>

</body>
</html>
